# Banco local para desenvolvimento: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: local_user
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: medialake
    ports:
      - '54320:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
